  <rect x="218" y="134" width="22" height="34" rx="4" fill="#0f4843"/>
  <path d="M256 128 L272 121 L272 160 L256 166Z" fill="#0f4843"/>
  <!-- roof -->
  <path d="M132 104 L254 104 L254 116 L132 116Z" fill="#7fd9cc"/>
  <path d="M132 104 L164 88 L288 88 L254 104Z" fill="#a8eadf"/>
  <path d="M254 104 L288 88 L288 100 L254 116Z" fill="#5cc7b9"/>
