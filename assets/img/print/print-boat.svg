  <path d="M196 56 V94 Q213 102 230 94 V56Z" fill="#2f9a8f"/>
  <path d="M213 56 V100 Q222 99 230 94 V56Z" fill="#23786f"/>
  <ellipse cx="213" cy="56" rx="17" ry="7" fill="#7fd9cc"/>
  <ellipse cx="213" cy="56" rx="10" ry="4" fill="#0f4843"/>
  <!-- highlights -->
  <path d="M70 238 Q140 248 240 244" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
  <path d="M152 122 V200" stroke="#fff" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
</svg>
