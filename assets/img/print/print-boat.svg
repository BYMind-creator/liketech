<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340">
  <!-- 扁平向量插畫風：3/4 側視 Benchy -->
  <defs>
    <linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb6a8"/><stop offset="1" stop-color="#1f7f76"/></linearGradient>
    <pattern id="ly" width="6" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H6" stroke="#000" stroke-opacity=".09"/></pattern>
  </defs>
  <ellipse cx="205" cy="300" rx="150" ry="13" fill="#000" opacity=".35"/>
  <!-- stern box -->
